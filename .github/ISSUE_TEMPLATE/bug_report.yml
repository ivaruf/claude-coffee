name: Bug report
description: The Mac slept when it shouldn't have, or stayed awake when it should have slept
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and whether the lid was open or closed.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `~/.claude/hooks/claude-coffee.sh status`
      render: text
    validations:
      required: true
  - type: textarea
    id: kernel
    attributes:
      label: Kernel power log (optional, but the most useful clue)
      description: |
        `log show --last 1h --style compact --predicate 'process == "kernel" AND eventMessage CONTAINS "PMRD"' | grep -E 'prevented|sleep reason|Clamshell closed'`
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.6.2, MacBook Pro (Apple silicon)
    validations:
      required: true
  - type: dropdown
    id: power
    attributes:
      label: Power
      options: [AC, Battery, Both]
