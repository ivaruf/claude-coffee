name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version && make lint

  test:
    # Every backend runs on every runner (fixtures fake each system's commands), so this also proves the
    # scripts work with BSD tools (macOS), GNU tools and dash (Ubuntu) and Git Bash (Windows)
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: uname -a && jq --version && command -v sh awk find ps
      - run: sh tests/run.sh
