name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version && make lint

  test:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: sw_vers && jq --version
      - run: make test
