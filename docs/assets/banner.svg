<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">claude-coffee</title>
  <desc id="desc">A little orange Claude holds a steaming mug of coffee next to the words: claude-coffee. Your Mac stays awake while Claude is brewing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1b13"/>
      <stop offset="1" stop-color="#130b07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.6" r="0.42">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e88b68"/>
      <stop offset="1" stop-color="#cc6a49"/>
    </linearGradient>
    <style>
      .steam { fill: none; stroke: #f3e6d8; stroke-width: 5; stroke-linecap: round; opacity: 0;
               animation: rise 3.2s ease-in-out infinite; }
      .s2 { animation-delay: 1.6s; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .6; } 100% { opacity: 0; transform: translateY(-18px); } }
      .blink { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
      @media (prefers-reduced-motion: reduce) {
        .steam { animation: none; opacity: .45; }
        .blink { animation: none; }
      }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- little Claude with a coffee -->
  <ellipse cx="270" cy="306" rx="120" ry="14" fill="#0b0604" opacity="0.5"/>
  <g transform="translate(262 196) scale(1.72)">
    <ellipse cx="-20" cy="54" rx="15" ry="8" fill="#a9553b"/>
    <ellipse cx="20" cy="54" rx="15" ry="8" fill="#a9553b"/>
    <rect x="-50" y="-52" width="100" height="106" rx="46" fill="url(#body)"/>
    <path d="M-2 -51 C -8 -68 12 -76 14 -62" fill="none" stroke="#e88b68" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="-24" cy="-30" rx="15" ry="8" fill="#fff" opacity=".14" transform="rotate(-28 -24 -30)"/>
    <g class="blink">
      <ellipse cx="-16" cy="-10" rx="6" ry="8.5" fill="#2b1b13"/>
      <ellipse cx="14" cy="-10" rx="6" ry="8.5" fill="#2b1b13"/>
    </g>
    <circle cx="-14" cy="-13" r="2.3" fill="#fff"/>
    <circle cx="16" cy="-13" r="2.3" fill="#fff"/>
    <ellipse cx="-31" cy="6" rx="7" ry="4" fill="#f6b8a0" opacity=".75"/>
    <ellipse cx="29" cy="6" rx="7" ry="4" fill="#f6b8a0" opacity=".75"/>
    <path d="M-8 8 C -4 13 2 13 6 8" fill="none" stroke="#2b1b13" stroke-width="3" stroke-linecap="round"/>
    <path class="steam" d="M50 -16 C 44 -26 56 -34 50 -46"/>
    <path class="steam s2" d="M62 -16 C 56 -26 68 -34 62 -46"/>
    <g transform="translate(40 -6)">
      <path d="M31 9 C 44 9 44 27 31 27" fill="none" stroke="#e9dccd" stroke-width="6" stroke-linecap="round"/>
      <rect x="0" y="0" width="33" height="38" rx="7" fill="#fbf4ec"/>
      <ellipse cx="16.5" cy="3.5" rx="13" ry="3" fill="#6b3f26"/>
      <rect x="0" y="16" width="33" height="6" fill="#d2704f" opacity=".85"/>
    </g>
    <ellipse cx="42" cy="18" rx="10" ry="8" fill="#c4654a"/>
    <ellipse cx="-44" cy="20" rx="8" ry="10" fill="#c4654a"/>
  </g>

  <!-- words -->
  <text x="484" y="168" class="sans" font-size="80" font-weight="800" fill="#fbf4ec" letter-spacing="-1.5">claude-coffee</text>
  <text x="488" y="222" class="sans" font-size="29" font-weight="500" fill="#e8cdb5">Your Mac stays awake while Claude is brewing.</text>
  <text x="488" y="274" class="mono" font-size="19" fill="#e39a7c">lid closed · many sessions · sleeps the moment it's done</text>
</svg>
