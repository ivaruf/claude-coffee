<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">claude-coffee</title>
  <desc id="desc">A wide-awake, steaming coffee cup next to the words: claude-coffee. Your Mac stays awake while Claude is brewing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1b13"/>
      <stop offset="1" stop-color="#130b07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf4ec"/>
      <stop offset="0.7" stop-color="#efe2d3"/>
      <stop offset="1" stop-color="#d8c4ae"/>
    </linearGradient>
    <radialGradient id="crema" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#b87a4b"/>
      <stop offset="1" stop-color="#5a3420"/>
    </radialGradient>
    <style>
      .steam { fill: none; stroke: #f3e6d8; stroke-width: 7; stroke-linecap: round; opacity: 0;
               animation: rise 3.6s ease-in-out infinite; }
      .s2 { animation-delay: 1.2s; }
      .s3 { animation-delay: 2.4s; }
      @keyframes rise {
        0%   { opacity: 0;   transform: translateY(16px); }
        35%  { opacity: .6; }
        100% { opacity: 0;   transform: translateY(-28px); }
      }
      .blink { animation: blink 5s infinite; transform-origin: 270px 214px; }
      @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
      @media (prefers-reduced-motion: reduce) {
        .steam { animation: none; opacity: .45; }
        .blink { animation: none; }
      }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- steam -->
  <path class="steam"    d="M232 118 C214 98 250 82 232 58"/>
  <path class="steam s2" d="M272 112 C254 92 290 76 272 52"/>
  <path class="steam s3" d="M312 118 C294 98 330 82 312 58"/>

  <!-- saucer -->
  <ellipse cx="272" cy="302" rx="158" ry="22" fill="#0b0604" opacity="0.55"/>
  <ellipse cx="272" cy="294" rx="150" ry="20" fill="#e6d6c4"/>
  <ellipse cx="272" cy="290" rx="112" ry="12" fill="#cdb7a0"/>

  <!-- handle -->
  <path d="M366 178 C428 172 430 254 352 258" fill="none" stroke="#e9dccd" stroke-width="18" stroke-linecap="round"/>

  <!-- cup -->
  <path d="M168 146 H376 C376 232 356 284 306 290 H238 C188 284 168 232 168 146 Z" fill="url(#cup)"/>
  <ellipse cx="272" cy="146" rx="104" ry="17" fill="#fbf4ec"/>
  <ellipse cx="272" cy="148" rx="92" ry="12" fill="url(#crema)"/>
  <path d="M232 146 C252 138 292 138 312 148" fill="none" stroke="#e7c9a6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- wide-awake face -->
  <g class="blink">
    <ellipse cx="244" cy="214" rx="12" ry="16" fill="#2b1b13"/>
    <ellipse cx="300" cy="214" rx="12" ry="16" fill="#2b1b13"/>
    <circle cx="248" cy="208" r="4" fill="#fbf4ec"/>
    <circle cx="304" cy="208" r="4" fill="#fbf4ec"/>
  </g>
  <path d="M258 246 C266 254 278 254 286 246" fill="none" stroke="#2b1b13" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="222" cy="240" rx="11" ry="6" fill="#d97757" opacity="0.35"/>
  <ellipse cx="322" cy="240" rx="11" ry="6" fill="#d97757" opacity="0.35"/>

  <!-- words -->
  <text x="484" y="168" class="sans" font-size="80" font-weight="800" fill="#fbf4ec" letter-spacing="-1.5">claude-coffee</text>
  <text x="488" y="222" class="sans" font-size="29" font-weight="500" fill="#e8cdb5">Your Mac stays awake while Claude is brewing.</text>
  <text x="488" y="274" class="mono" font-size="19" fill="#e39a7c">lid closed · many sessions · sleeps the moment it's done</text>
</svg>
