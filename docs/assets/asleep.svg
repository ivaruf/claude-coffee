<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Done. Fast asleep.</title>
  <desc id="desc">Night. The lid is still closed and the Mac has gone to sleep. Claude is asleep on top of it next to an empty mug, with z's floating up and a crescent moon outside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18203a"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c97f66"/>
      <stop offset="1" stop-color="#a95f48"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b9aa3"/>
      <stop offset="1" stop-color="#6e6d77"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="440" height="300" fill="#fff"/>
      <circle cx="386" cy="54" r="22" fill="#000"/>
    </mask>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .z { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800;
           fill: #b9c6ef; opacity: 0; animation: float 4.2s ease-in-out infinite; }
      .z2 { animation-delay: 1.4s; } .z3 { animation-delay: 2.8s; }
      @keyframes float { 0% { opacity: 0; transform: translate(0, 8px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(10px, -22px); } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; }
      @keyframes tw { 50% { opacity: .25; } }
      .breathe { animation: br 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes br { 50% { transform: scaleY(0.975); } }
      @media (prefers-reduced-motion: reduce) { .z { animation: none; opacity: .8; } .twinkle, .breathe { animation: none; } }
    </style>
  </defs>

  <rect width="440" height="300" rx="20" fill="url(#bg)"/>

  <!-- stars and moon -->
  <circle class="twinkle" cx="150" cy="40" r="2" fill="#dfe6ff"/>
  <circle class="twinkle t2" cx="236" cy="26" r="1.6" fill="#dfe6ff"/>
  <circle class="twinkle t3" cx="304" cy="70" r="1.8" fill="#dfe6ff"/>
  <circle class="twinkle t2" cx="96" cy="92" r="1.4" fill="#dfe6ff"/>
  <circle class="twinkle" cx="342" cy="118" r="1.5" fill="#dfe6ff"/>
  <circle cx="374" cy="62" r="24" fill="#f3e9c9" mask="url(#crescent)"/>

  <!-- status chip -->
  <rect x="20" y="20" width="100" height="30" rx="15" fill="#5f80d8"/>
  <g transform="translate(36 27)">
    <circle cx="7" cy="8" r="7" fill="#0f1426"/>
    <circle cx="10.5" cy="5.5" r="6" fill="#5f80d8"/>
  </g>
  <text x="56" y="40" class="sans" font-size="15" font-weight="700" fill="#0f1426">asleep</text>

  <!-- z's -->
  <text class="z" x="262" y="122" font-size="18">z</text>
  <text class="z z2" x="276" y="104" font-size="23">z</text>
  <text class="z z3" x="292" y="84" font-size="28">z</text>

  <!-- desk -->
  <path d="M0 236 H440 V280 A20 20 0 0 1 420 300 H20 A20 20 0 0 1 0 280 Z" fill="#1d1a24"/>
  <rect x="0" y="234" width="440" height="4" fill="#2a2633"/>

  <!-- closed MacBook, asleep -->
  <rect x="60" y="212" width="320" height="20" rx="7" fill="url(#alu)"/>
  <rect x="60" y="221" width="320" height="2" fill="#5f5e68"/>
  <rect x="190" y="228" width="60" height="4" rx="2" fill="#56555f"/>

  <!-- empty mug -->
  <g transform="translate(298 176)">
    <path d="M31 9 C 44 9 44 27 31 27" fill="none" stroke="#a9a4ae" stroke-width="6" stroke-linecap="round"/>
    <rect x="0" y="0" width="33" height="36" rx="7" fill="#cfcad3"/>
    <ellipse cx="16.5" cy="3.5" rx="13" ry="3" fill="#8d8794"/>
    <rect x="0" y="16" width="33" height="6" fill="#5f80d8" opacity=".8"/>
  </g>

  <!-- Claude, asleep on the lid -->
  <g transform="translate(206 160) scale(0.86)">
    <ellipse cx="-20" cy="50" rx="15" ry="8" fill="#8a4a37"/>
    <ellipse cx="20" cy="50" rx="15" ry="8" fill="#8a4a37"/>
    <g class="breathe">
      <rect x="-52" y="-44" width="104" height="98" rx="46" fill="url(#body)"/>
    </g>
    <path d="M-2 -43 C -14 -54 -2 -66 8 -58" fill="none" stroke="#c97f66" stroke-width="7" stroke-linecap="round"/>
    <path d="M-22 -4 C -18 2 -10 2 -6 -4" fill="none" stroke="#2b1b13" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 -4 C 12 2 20 2 24 -4" fill="none" stroke="#2b1b13" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-30" cy="10" rx="7" ry="4" fill="#e6a993" opacity=".6"/>
    <ellipse cx="32" cy="10" rx="7" ry="4" fill="#e6a993" opacity=".6"/>
    <ellipse cx="1" cy="15" rx="4" ry="3.2" fill="#2b1b13"/>
    <ellipse cx="-46" cy="24" rx="8" ry="10" fill="#9b5640"/>
    <ellipse cx="48" cy="24" rx="8" ry="10" fill="#9b5640"/>
  </g>

  <text x="220" y="274" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#e6ebff">Done. Fast asleep.</text>
</svg>
