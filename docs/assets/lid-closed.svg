<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Lid closed. Still brewing.</title>
  <desc id="desc">The MacBook's lid is closed, but the Mac is awake: Claude sits on top of it with a steaming coffee, and a thought bubble says Brewing, 18 minutes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1b13"/>
      <stop offset="1" stop-color="#160d09"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e88b68"/>
      <stop offset="1" stop-color="#cc6a49"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2dbd4"/>
      <stop offset="1" stop-color="#aaa29b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d2704f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d2704f" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .steam { fill: none; stroke: #f3e6d8; stroke-width: 4.5; stroke-linecap: round; opacity: 0;
               animation: rise 3.2s ease-in-out infinite; }
      .s2 { animation-delay: 1.6s; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-16px); } }
      .spin { animation: spin 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .steam { animation: none; opacity: .45; } .spin, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="440" height="300" rx="20" fill="url(#bg)"/>

  <!-- status chip -->
  <rect x="20" y="20" width="96" height="30" rx="15" fill="#d2704f"/>
  <g transform="translate(36 28)">
    <rect x="0" y="2" width="11" height="10" rx="2.5" fill="#1f140e"/>
    <path d="M11 4.5 C15 4.5 15 9.5 11 9.5" fill="none" stroke="#1f140e" stroke-width="1.8"/>
  </g>
  <text x="58" y="40" class="sans" font-size="15" font-weight="700" fill="#1f140e">awake</text>

  <!-- thought bubble -->
  <rect x="236" y="34" width="176" height="42" rx="21" fill="#fbf4ec"/>
  <circle cx="246" cy="92" r="7" fill="#fbf4ec"/>
  <circle cx="236" cy="108" r="4" fill="#fbf4ec"/>
  <g class="spin">
    <g transform="translate(258 55)" stroke="#d2704f" stroke-width="2.6" stroke-linecap="round">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/>
      <line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
    </g>
  </g>
  <text x="272" y="60" class="mono" font-size="15" font-weight="700" fill="#b85a3b">Brewing…</text>
  <text x="358" y="60" class="mono" font-size="14" fill="#8c7867">18m</text>

  <!-- desk -->
  <path d="M0 236 H440 V280 A20 20 0 0 1 420 300 H20 A20 20 0 0 1 0 280 Z" fill="#3a2418"/>
  <rect x="0" y="234" width="440" height="4" fill="#4d3122"/>

  <!-- closed MacBook, still alive -->
  <ellipse class="pulse" cx="220" cy="232" rx="190" ry="20" fill="url(#halo)"/>
  <rect x="60" y="212" width="320" height="20" rx="7" fill="url(#alu)"/>
  <rect x="60" y="221" width="320" height="2" fill="#9a928b"/>
  <rect x="190" y="228" width="60" height="4" rx="2" fill="#8f877f"/>

  <!-- Claude, sitting on the lid -->
  <g transform="translate(206 157) scale(0.86)">
    <ellipse cx="-20" cy="54" rx="15" ry="8" fill="#a9553b"/>
    <ellipse cx="20" cy="54" rx="15" ry="8" fill="#a9553b"/>
    <rect x="-50" y="-52" width="100" height="106" rx="46" fill="url(#body)"/>
    <path d="M-2 -51 C -8 -68 12 -76 14 -62" fill="none" stroke="#e88b68" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="-24" cy="-30" rx="15" ry="8" fill="#fff" opacity=".14" transform="rotate(-28 -24 -30)"/>
    <ellipse cx="-14" cy="-10" rx="6" ry="8.5" fill="#2b1b13"/>
    <ellipse cx="16" cy="-10" rx="6" ry="8.5" fill="#2b1b13"/>
    <circle cx="-12" cy="-13" r="2.3" fill="#fff"/>
    <circle cx="18" cy="-13" r="2.3" fill="#fff"/>
    <ellipse cx="-30" cy="6" rx="7" ry="4" fill="#f6b8a0" opacity=".75"/>
    <ellipse cx="30" cy="6" rx="7" ry="4" fill="#f6b8a0" opacity=".75"/>
    <path d="M-6 7 C -2 13 4 13 8 7" fill="none" stroke="#2b1b13" stroke-width="3" stroke-linecap="round"/>
    <path class="steam" d="M50 -16 C 44 -26 56 -34 50 -46"/>
    <path class="steam s2" d="M62 -16 C 56 -26 68 -34 62 -46"/>
    <g transform="translate(40 -6)">
      <path d="M31 9 C 44 9 44 27 31 27" fill="none" stroke="#e9dccd" stroke-width="6" stroke-linecap="round"/>
      <rect x="0" y="0" width="33" height="38" rx="7" fill="#fbf4ec"/>
      <ellipse cx="16.5" cy="3.5" rx="13" ry="3" fill="#6b3f26"/>
      <rect x="0" y="16" width="33" height="6" fill="#d2704f" opacity=".85"/>
    </g>
    <ellipse cx="42" cy="18" rx="10" ry="8" fill="#c4654a"/>
    <ellipse cx="-44" cy="20" rx="8" ry="10" fill="#c4654a"/>
  </g>

  <text x="220" y="274" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#fbf4ec">Lid closed. Still brewing.</text>
</svg>
