<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code, mid-turn</title>
  <desc id="desc">An open MacBook on a desk, between a plant and a steaming mug of coffee. The terminal shows Claude Code working: Brewing, 12 minutes 40 seconds. A coffee cup in the menu bar shows the Mac is being kept awake.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1b13"/>
      <stop offset="1" stop-color="#160d09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e88b68"/>
      <stop offset="1" stop-color="#cc6a49"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6cf"/>
      <stop offset="1" stop-color="#a9a19a"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .steam { fill: none; stroke: #f3e6d8; stroke-width: 5; stroke-linecap: round; opacity: 0;
               animation: rise 3.2s ease-in-out infinite; }
      .s2 { animation-delay: 1.6s; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-18px); } }
      .spin { animation: spin 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .cursor { animation: cur 1.1s steps(1) infinite; }
      @keyframes cur { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .steam { animation: none; opacity: .45; } .spin, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect width="900" height="440" rx="24" fill="url(#bg)"/>
  <rect width="900" height="440" rx="24" fill="url(#glow)"/>

  <!-- desk -->
  <path d="M0 368 H900 V416 A24 24 0 0 1 876 440 H24 A24 24 0 0 1 0 416 Z" fill="#3a2418"/>
  <rect x="0" y="366" width="900" height="4" fill="#4d3122"/>

  <!-- plant -->
  <g transform="translate(78 300)">
    <path d="M-6 0 C -30 -30 -26 -62 -8 -78 C -10 -50 -4 -24 -6 0 Z" fill="#6f8f5b"/>
    <path d="M4 0 C 26 -22 38 -54 22 -76 C 18 -48 10 -24 4 0 Z" fill="#87a86f"/>
    <path d="M0 0 C -4 -30 0 -60 6 -92 C 12 -60 8 -28 0 0 Z" fill="#7b9c64"/>
    <path d="M-30 0 H30 L24 66 H-24 Z" fill="#c9684a"/>
    <rect x="-34" y="-4" width="68" height="12" rx="4" fill="#d97757"/>
  </g>

  <!-- MacBook -->
  <rect x="170" y="62" width="440" height="296" rx="16" fill="#0c0807" stroke="#3a3330" stroke-width="2"/>
  <rect x="182" y="74" width="416" height="272" rx="6" fill="#16100c"/>
  <rect x="372" y="74" width="36" height="8" rx="4" fill="#0c0807"/>
  <!-- menu bar: a cup marks "kept awake" -->
  <rect x="182" y="74" width="416" height="20" rx="6" fill="#241912"/>
  <rect x="182" y="86" width="416" height="8" fill="#241912"/>
  <circle cx="198" cy="84" r="3.5" fill="#6b5a4f"/>
  <g transform="translate(560 78)">
    <rect x="0" y="2" width="11" height="10" rx="2.5" fill="#e8896a"/>
    <path d="M11 4.5 C15 4.5 15 9.5 11 9.5" fill="none" stroke="#e8896a" stroke-width="1.8"/>
  </g>
  <rect x="578" y="80" width="10" height="7" rx="1.5" fill="none" stroke="#8a7a6e" stroke-width="1.2"/>

  <!-- terminal -->
  <g class="mono" font-size="14">
    <text x="198" y="126" fill="#9c8574">&gt; refactor the billing module, add tests</text>
    <circle cx="203" cy="157" r="4" fill="#7fbf8a"/>
    <text x="214" y="162" fill="#efe2d3">Read 14 files</text>
    <circle cx="203" cy="186" r="4" fill="#7fbf8a"/>
    <text x="214" y="191" fill="#efe2d3">Update(src/billing/invoice.ts)</text>
    <text x="214" y="214" fill="#8c7867">└ 48 additions, 12 removals</text>
    <circle cx="203" cy="240" r="4" fill="#7fbf8a"/>
    <text x="214" y="245" fill="#efe2d3">Bash(npm test)</text>
    <text x="214" y="268" fill="#8c7867">└ 212 passing</text>
    <g class="spin">
      <g transform="translate(204 312)" stroke="#e8896a" stroke-width="2.6" stroke-linecap="round">
        <line x1="0" y1="-7" x2="0" y2="7"/>
        <line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/>
        <line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
      </g>
    </g>
    <text x="218" y="317" fill="#e8896a" font-weight="700">Brewing…</text>
    <text x="300" y="317" fill="#8c7867">(12m 40s · esc to interrupt)</text>
    <rect class="cursor" x="198" y="330" width="8" height="3" fill="#efe2d3" opacity="0"/>
  </g>
  <!-- base -->
  <path d="M146 356 H634 L620 374 H160 Z" fill="url(#alu)"/>
  <rect x="356" y="356" width="68" height="5" rx="2.5" fill="#8f877f"/>

  <!-- coffee -->
  <ellipse cx="766" cy="367" rx="52" ry="7" fill="#24160f"/>
  <path class="steam" d="M752 290 C 744 274 760 262 752 244"/>
  <path class="steam s2" d="M774 290 C 766 274 782 262 774 244"/>
  <g transform="translate(737 304) scale(1.6)">
    <path d="M31 9 C 44 9 44 27 31 27" fill="none" stroke="#e9dccd" stroke-width="6" stroke-linecap="round"/>
    <rect x="0" y="0" width="33" height="38" rx="7" fill="#fbf4ec"/>
    <ellipse cx="16.5" cy="3.5" rx="13" ry="3" fill="#6b3f26"/>
    <rect x="0" y="16" width="33" height="6" fill="#d2704f" opacity=".85"/>
  </g>
</svg>
