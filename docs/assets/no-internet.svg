<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc">
  <title id="title">No internet</title>
  <desc id="desc">Little Claude stands on the closed MacBook, trembling, wide-eyed and sweating, clutching a printout titled The Complex Task. A speech bubble says: I can't finish this myself. I'm a shell script. Next to it a crossed-out Wi-Fi sign pulses: checking, every 20 seconds, for up to an hour. Two status chips read: no internet, then carries on. Caption: Lost the internet? It waits, then carries on.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211d2b"/>
      <stop offset="1" stop-color="#0e0c13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.4" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#8fa3d6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fa3d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98a6c"/>
      <stop offset="1" stop-color="#b9664a"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d2cb"/>
      <stop offset="1" stop-color="#a39b94"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .shiver { animation: shiver .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes shiver { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
      .dart { animation: dart 1.8s steps(1) infinite; }
      @keyframes dart { 0% { transform: translateX(-2.5px); } 50% { transform: translateX(2.5px); } }
      .ping { opacity: .16; animation: ping 2.4s ease-in-out infinite; }
      .p2 { animation-delay: .3s; } .p3 { animation-delay: .6s; }
      @keyframes ping { 10%, 30% { opacity: .95; } 55% { opacity: .16; } }
      .drop { animation: drip 1.7s ease-in infinite; }
      @keyframes drip { 0% { opacity: 0; transform: translateY(-4px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(16px); } }
      .huh { animation: huh 2.2s ease-in-out infinite; }
      .h2 { animation-delay: 1.1s; }
      @keyframes huh { 0%, 100% { opacity: .25; transform: translateY(3px); } 50% { opacity: 1; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { .shiver, .dart, .ping, .drop, .huh { animation: none; } .ping { opacity: .6; } }
    </style>
  </defs>

  <rect width="900" height="400" rx="24" fill="url(#bg)"/>
  <rect width="900" height="400" rx="24" fill="url(#glow)"/>

  <!-- status: no internet → carries on -->
  <rect x="24" y="24" width="136" height="30" rx="15" fill="#9aa6c8"/>
  <g transform="translate(40 30)" fill="none" stroke="#141725" stroke-width="2.2" stroke-linecap="round">
    <path d="M1 7 A 12 12 0 0 1 19 7"/>
    <path d="M5 11 A 7 7 0 0 1 15 11"/>
    <circle cx="10" cy="15" r="1.6" fill="#141725" stroke="none"/>
    <path d="M2 1 L18 18"/>
  </g>
  <text x="66" y="44" class="sans" font-size="15" font-weight="700" fill="#141725">no internet</text>
  <path d="M170 39 H194 M187 32 L195 39 L187 46" fill="none" stroke="#f3e6d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="204" y="24" width="128" height="30" rx="15" fill="#d2704f"/>
  <path d="M221 31 L232 39 L221 47 Z" fill="#1f140e"/>
  <text x="240" y="44" class="sans" font-size="15" font-weight="700" fill="#1f140e">carries on</text>

  <!-- desk -->
  <path d="M0 316 H900 V376 A24 24 0 0 1 876 400 H24 A24 24 0 0 1 0 376 Z" fill="#221e29"/>
  <rect x="0" y="314" width="900" height="4" fill="#2f2a38"/>

  <!-- closed MacBook -->
  <rect x="180" y="292" width="340" height="22" rx="7" fill="url(#alu)"/>
  <rect x="180" y="302" width="340" height="2" fill="#8f877f"/>
  <rect x="320" y="309" width="60" height="4" rx="2" fill="#7e766f"/>

  <!-- question marks -->
  <text x="270" y="186" class="sans huh" font-size="30" font-weight="800" fill="#c9c3dd">?</text>
  <text x="290" y="150" class="sans huh h2" font-size="22" font-weight="800" fill="#c9c3dd">?</text>

  <!-- Claude, very worried, clutching the task -->
  <g transform="translate(350 236) scale(0.92)">
    <ellipse cx="-20" cy="54" rx="15" ry="8" fill="#94503a"/>
    <ellipse cx="20" cy="54" rx="15" ry="8" fill="#94503a"/>
    <g class="shiver">
      <rect x="-50" y="-52" width="100" height="106" rx="46" fill="url(#body)"/>
      <path d="M-2 -51 C -8 -68 12 -76 14 -62" fill="none" stroke="#d98a6c" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="-24" cy="-30" rx="15" ry="8" fill="#fff" opacity=".12" transform="rotate(-28 -24 -30)"/>
      <!-- brows up in the middle -->
      <path d="M-28 -25 L-10 -31 M8 -31 L26 -25" stroke="#2b1b13" stroke-width="3.5" stroke-linecap="round"/>
      <!-- wide eyes, darting -->
      <circle cx="-17" cy="-13" r="8.5" fill="#fbf4ec"/>
      <circle cx="15" cy="-13" r="8.5" fill="#fbf4ec"/>
      <g class="dart">
        <circle cx="-17" cy="-12" r="3.4" fill="#2b1b13"/>
        <circle cx="15" cy="-12" r="3.4" fill="#2b1b13"/>
      </g>
      <ellipse cx="-33" cy="2" rx="7" ry="4" fill="#eaa48c" opacity=".5"/>
      <ellipse cx="31" cy="2" rx="7" ry="4" fill="#eaa48c" opacity=".5"/>
      <!-- wobbly mouth -->
      <path d="M-13 9 l4.3 -4 l4.3 4 l4.3 -4 l4.3 4 l4.3 -4" fill="none" stroke="#2b1b13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- THE COMPLEX TASK -->
      <g transform="rotate(-5)">
        <rect x="-42" y="18" width="84" height="46" rx="4" fill="#fbf4ec"/>
        <text x="0" y="32" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#2b1b13" letter-spacing=".2">THE COMPLEX</text>
        <text x="0" y="42" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#2b1b13" letter-spacing=".2">TASK</text>
        <g stroke="#b9a99c" stroke-width="2" stroke-linecap="round">
          <line x1="-28" y1="50" x2="24" y2="50"/>
          <line x1="-28" y1="57" x2="14" y2="57"/>
        </g>
      </g>
      <ellipse cx="-42" cy="54" rx="9" ry="8" fill="#a85a41"/>
      <ellipse cx="40" cy="47" rx="9" ry="8" fill="#a85a41"/>
    </g>
  </g>
  <!-- sweat -->
  <g class="drop"><path d="M404 192 C 408 199 410 203 404 207 C 398 203 400 199 404 192 Z" fill="#9fd3ff"/></g>

  <!-- speech bubble -->
  <path d="M446 72 H650 A16 16 0 0 1 666 88 V122 A16 16 0 0 1 650 138 H478 L424 170 L452 138 H446 A16 16 0 0 1 430 122 V88 A16 16 0 0 1 446 72 Z" fill="#fbf4ec"/>
  <text x="448" y="100" class="sans" font-size="15" font-weight="700" fill="#2b1b13">I can't finish this myself.</text>
  <text x="448" y="122" class="sans" font-size="15" font-weight="600" fill="#7a5644">I'm a shell script.</text>

  <!-- Wi-Fi, gone, still checking -->
  <g fill="none" stroke="#f3e6d8" stroke-width="9" stroke-linecap="round">
    <path class="ping p3" d="M688.3 194.3 A 66 66 0 0 1 781.7 194.3"/>
    <path class="ping p2" d="M703.9 209.9 A 44 44 0 0 1 766.1 209.9"/>
    <path class="ping" d="M719.4 225.4 A 22 22 0 0 1 750.6 225.4"/>
  </g>
  <circle cx="735" cy="244" r="7" fill="#f3e6d8" opacity=".9"/>
  <path d="M694 170 L776 252" stroke="#0e0c13" stroke-width="15" stroke-linecap="round"/>
  <path d="M694 170 L776 252" stroke="#e4572e" stroke-width="7" stroke-linecap="round"/>
  <text x="735" y="284" text-anchor="middle" class="sans" font-size="22" font-weight="800" fill="#fbf4ec">checking…</text>
  <text x="735" y="304" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#b9b4cc">every 20 s, for up to an hour</text>

  <text x="450" y="364" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#fbf4ec">Lost the internet? It waits, then carries on.</text>
</svg>
